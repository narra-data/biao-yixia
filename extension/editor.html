<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>裱一下 · 截图美化</title>
<style>
:root {
  --bg: #0b0e17;
  --panel: #121828;
  --panel-2: #182036;
  --line: #232c45;
  --ink: #edf1fb;
  --dim: #8b93b5;
  --faint: #565e7e;
  --accent: #ffd9a0;
  --accent-2: #f7a8bc;
  --hanzi: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  --mono: Consolas, 'Cascadia Code', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--hanzi);
  font-size: 14px; display: flex; flex-direction: column; overflow: hidden;
  user-select: none;
}
.topbar {
  height: 52px; flex: none; display: flex; align-items: center; gap: 14px;
  padding: 0 18px; border-bottom: 1px solid var(--line);
}
.logo { font-size: 17px; font-weight: 800; letter-spacing: 0.1em; }
.logo b { color: var(--accent); }
.tip { color: var(--faint); font-size: 12px; }
.topbar .spacer { flex: 1; }
.kbd {
  font-family: var(--mono); font-size: 11px; color: var(--dim);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; margin: 0 2px;
}
.main { flex: 1; display: flex; min-height: 0; }

/* ---------- preview ---------- */
.stage {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
  padding: 26px; position: relative;
  background:
    linear-gradient(45deg, #0d1120 25%, transparent 25%, transparent 75%, #0d1120 75%),
    linear-gradient(45deg, #0d1120 25%, transparent 25%, transparent 75%, #0d1120 75%),
    #0a0d18;
  background-size: 22px 22px; background-position: 0 0, 11px 11px;
}
.stage.drag { outline: 3px dashed var(--accent); outline-offset: -12px; }
#preview {
  max-width: 100%; max-height: 100%; border-radius: 4px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
}
.empty-hint {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; pointer-events: none;
  color: var(--dim); text-align: center;
}
.empty-hint .big { font-size: 40px; }
.empty-hint .t { font-size: 16px; font-weight: 700; color: var(--ink); }
.empty-hint.hidden { display: none; }

/* ---------- panel ---------- */
.panel {
  width: 312px; flex: none; border-left: 1px solid var(--line);
  background: var(--panel); padding: 18px 18px 14px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px;
}
.grp-label {
  font-size: 11px; letter-spacing: 0.2em; color: var(--faint); margin-bottom: 8px;
  text-transform: uppercase; font-family: var(--mono);
}
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.swatch {
  aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent;
  position: relative; overflow: hidden;
}
.swatch.on { border-color: var(--accent); }
.swatch:hover { filter: brightness(1.12); }
.swatch.transparent {
  background:
    linear-gradient(45deg, #3a4260 25%, transparent 25%, transparent 75%, #3a4260 75%),
    linear-gradient(45deg, #3a4260 25%, transparent 25%, transparent 75%, #3a4260 75%),
    #232c45;
  background-size: 10px 10px; background-position: 0 0, 5px 5px;
}
.slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.slider-row label { width: 52px; flex: none; color: var(--dim); font-size: 12.5px; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--accent); height: 4px; }
.slider-row .val {
  width: 34px; text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--faint);
}
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  font-family: var(--hanzi); font-size: 12px; color: var(--dim); cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px;
}
.seg button.on { color: var(--accent); border-color: rgba(255, 217, 160, 0.6); }
.seg button:hover { color: var(--ink); }
input.txt {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
  color: var(--ink); font-family: var(--hanzi); font-size: 13px; padding: 8px 10px; outline: none;
}
input.txt:focus { border-color: var(--accent); }
.actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
.btn {
  width: 100%; padding: 12px 0; border-radius: 8px; font-size: 14px; font-weight: 700;
  font-family: var(--hanzi); cursor: pointer; border: none; letter-spacing: 0.15em;
}
.btn.primary { background: linear-gradient(135deg, #ffd9a0, #ffb26b); color: #221505; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--dim); }
.btn.ghost:hover { color: var(--ink); border-color: var(--dim); }
.row2 { display: flex; gap: 8px; }
.row2 .btn { flex: 1; }
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  background: var(--panel-2); border: 1px solid rgba(255, 217, 160, 0.55); color: var(--accent);
  font-size: 13px; padding: 9px 22px; border-radius: 999px; z-index: 60;
  opacity: 0; pointer-events: none; transition: opacity 0.22s;
}
.toast.show { opacity: 1; }
.statline {
  font-size: 11px; color: var(--faint); text-align: center; font-family: var(--mono);
  margin-top: 6px;
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">裱<b>一下</b></span>
  <span class="tip">截图太裸?裱一下再发。</span>
  <span class="spacer"></span>
  <span class="tip"><span class="kbd">Ctrl</span>+<span class="kbd">V</span> 粘贴截图 · 拖入图片 · <span class="kbd">Ctrl</span>+<span class="kbd">C</span> 复制成品</span>
</div>
<div class="main">
  <div class="stage" id="stage">
    <canvas id="preview"></canvas>
    <div class="empty-hint" id="empty-hint">
      <div class="big">🖼️</div>
      <div class="t">把截图丢进来,或者 Ctrl + V</div>
      <div>支持 PNG / JPG / WebP · 全程本地处理,不上传</div>
    </div>
  </div>
  <div class="panel">
    <div>
      <div class="grp-label">背景 Background</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div>
      <div class="grp-label">画框 Frame</div>
      <div class="slider-row"><label>边距</label><input type="range" id="s-pad" min="0" max="18" value="7"><span class="val" id="v-pad">7%</span></div>
      <div class="slider-row"><label>圆角</label><input type="range" id="s-rad" min="0" max="60" value="16"><span class="val" id="v-rad">16</span></div>
      <div class="slider-row"><label>阴影</label><input type="range" id="s-shadow" min="0" max="100" value="55"><span class="val" id="v-shadow">55</span></div>
      <div class="slider-row"><label>缩放</label><input type="range" id="s-zoom" min="50" max="100" value="100"><span class="val" id="v-zoom">100</span></div>
    </div>
    <div>
      <div class="grp-label">画布比例 Aspect</div>
      <div class="seg" id="aspect-seg">
        <button data-a="auto" class="on">自适应</button>
        <button data-a="1:1">1:1</button>
        <button data-a="4:3">4:3</button>
        <button data-a="3:4">3:4 小红书</button>
        <button data-a="16:9">16:9</button>
      </div>
    </div>
    <div>
      <div class="grp-label">水印 Watermark</div>
      <input class="txt" id="wm-text" placeholder="留空 = 不加水印,例如 @你的账号名" value="">
    </div>
    <div class="actions">
      <button class="btn primary" id="btn-copy">复制 PNG(直接去粘贴)</button>
      <div class="row2">
        <button class="btn ghost" id="btn-save">保存文件</button>
        <button class="btn ghost" id="btn-2x">导出 1×</button>
      </div>
      <div class="statline" id="statline">等待图片…</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="editor.js"></script>
</body>
</html>
