<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>裱一下</title>
<style>
:root {
  --bg: #0b0e17;
  --panel: #121828;
  --panel-2: #182036;
  --line: #232c45;
  --ink: #edf1fb;
  --dim: #8b93b5;
  --faint: #565e7e;
  --accent: #ffd9a0;
  --accent-2: #f7a8bc;
  --hanzi: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  --mono: Consolas, 'Cascadia Code', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--hanzi);
  font-size: 14px; display: flex; flex-direction: column; overflow: hidden;
  user-select: none;
}
.topbar {
  height: 52px; flex: none; display: flex; align-items: center; gap: 14px;
  padding: 0 18px; border-bottom: 1px solid var(--line);
}
.logo { font-size: 17px; font-weight: 800; letter-spacing: 0.1em; }
.logo b { color: var(--accent); }
.tip { color: var(--faint); font-size: 12px; }
.topbar .spacer { flex: 1; }
.kbd {
  font-family: var(--mono); font-size: 11px; color: var(--dim);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; margin: 0 2px;
}
.main { flex: 1; display: flex; min-height: 0; }

/* ---------- preview ---------- */
.stage {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
  padding: 26px; position: relative;
  background:
    linear-gradient(45deg, #0d1120 25%, transparent 25%, transparent 75%, #0d1120 75%),
    linear-gradient(45deg, #0d1120 25%, transparent 25%, transparent 75%, #0d1120 75%),
    #0a0d18;
  background-size: 22px 22px; background-position: 0 0, 11px 11px;
}
.stage.drag { outline: 3px dashed var(--accent); outline-offset: -12px; }
#preview {
  max-width: 100%; max-height: 100%; border-radius: 4px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
}
.empty-hint {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; pointer-events: none;
  color: var(--dim); text-align: center;
}
.empty-hint .big { font-size: 40px; }
.empty-hint .t { font-size: 16px; font-weight: 700; color: var(--ink); }
.empty-hint.hidden { display: none; }

/* ---------- panel ---------- */
.panel {
  width: 312px; flex: none; border-left: 1px solid var(--line);
  background: var(--panel); padding: 18px 18px 14px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px;
}
.grp-label {
  font-size: 11px; letter-spacing: 0.2em; color: var(--faint); margin-bottom: 8px;
  text-transform: uppercase; font-family: var(--mono);
}
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.swatch {
  aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent;
  position: relative; overflow: hidden;
}
.swatch.on { border-color: var(--accent); }
.swatch:hover { filter: brightness(1.12); }
.swatch.transparent {
  background:
    linear-gradient(45deg, #3a4260 25%, transparent 25%, transparent 75%, #3a4260 75%),
    linear-gradient(45deg, #3a4260 25%, transparent 25%, transparent 75%, #3a4260 75%),
    #232c45;
  background-size: 10px 10px; background-position: 0 0, 5px 5px;
}
.slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.slider-row label { width: 52px; flex: none; color: var(--dim); font-size: 12.5px; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--accent); height: 4px; }
.slider-row .val {
  width: 34px; text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--faint);
}
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  font-family: var(--hanzi); font-size: 12px; color: var(--dim); cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px;
}
.seg button.on { color: var(--accent); border-color: rgba(255, 217, 160, 0.6); }
.seg button:hover { color: var(--ink); }
input.txt {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
  color: var(--ink); font-family: var(--hanzi); font-size: 13px; padding: 8px 10px; outline: none;
}
input.txt:focus { border-color: var(--accent); }
.actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
.btn {
  width: 100%; padding: 12px 0; border-radius: 8px; font-size: 14px; font-weight: 700;
  font-family: var(--hanzi); cursor: pointer; border: none; letter-spacing: 0.15em;
}
.btn.primary { background: linear-gradient(135deg, #ffd9a0, #ffb26b); color: #221505; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--dim); }
.btn.ghost:hover { color: var(--ink); border-color: var(--dim); }
.row2 { display: flex; gap: 8px; }
.row2 .btn { flex: 1; }
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  background: var(--panel-2); border: 1px solid rgba(255, 217, 160, 0.55); color: var(--accent);
  font-size: 13px; padding: 9px 22px; border-radius: 999px; z-index: 60;
  opacity: 0; pointer-events: none; transition: opacity 0.22s;
}
.toast.show { opacity: 1; }
.statline {
  font-size: 11px; color: var(--faint); text-align: center; font-family: var(--mono);
  margin-top: 6px;
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">裱<b>一下</b></span>
  <span class="tip">截图太裸?裱一下再发。</span>
  <span class="spacer"></span>
  <span class="tip"><span class="kbd">Ctrl</span>+<span class="kbd">V</span> 粘贴截图 · 拖入图片 · <span class="kbd">Ctrl</span>+<span class="kbd">C</span> 复制成品</span>
</div>
<div class="main">
  <div class="stage" id="stage">
    <canvas id="preview"></canvas>
    <div class="empty-hint" id="empty-hint">
      <div class="big">🖼️</div>
      <div class="t">把截图丢进来,或者 Ctrl + V</div>
      <div>支持 PNG / JPG / WebP · 全程本地处理,不上传</div>
    </div>
  </div>
  <div class="panel">
    <div>
      <div class="grp-label">背景 Background</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div>
      <div class="grp-label">画框 Frame</div>
      <div class="slider-row"><label>边距</label><input type="range" id="s-pad" min="0" max="18" value="7"><span class="val" id="v-pad">7%</span></div>
      <div class="slider-row"><label>圆角</label><input type="range" id="s-rad" min="0" max="60" value="16"><span class="val" id="v-rad">16</span></div>
      <div class="slider-row"><label>阴影</label><input type="range" id="s-shadow" min="0" max="100" value="55"><span class="val" id="v-shadow">55</span></div>
      <div class="slider-row"><label>缩放</label><input type="range" id="s-zoom" min="50" max="100" value="100"><span class="val" id="v-zoom">100</span></div>
    </div>
    <div>
      <div class="grp-label">画布比例 Aspect</div>
      <div class="seg" id="aspect-seg">
        <button data-a="auto" class="on">自适应</button>
        <button data-a="1:1">1:1</button>
        <button data-a="4:3">4:3</button>
        <button data-a="3:4">3:4 小红书</button>
        <button data-a="16:9">16:9</button>
      </div>
    </div>
    <div>
      <div class="grp-label">水印 Watermark</div>
      <input class="txt" id="wm-text" placeholder="留空 = 不加水印,例如 @你的账号名" value="">
    </div>
    <div class="actions">
      <button class="btn primary" id="btn-copy">复制 PNG(直接去粘贴)</button>
      <div class="row2">
        <button class="btn ghost" id="btn-save">保存文件</button>
        <button class="btn ghost" id="btn-2x">导出 1×</button>
      </div>
      <div class="statline" id="statline">等待图片…</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= state ================= */
const BGS = [
  { name: '星夜', type: 'g', stops: ['#1c2452', '#3b2f68'], angle: 135 },
  { name: '日冕', type: 'g', stops: ['#ffd9a0', '#ff8d5c'], angle: 135 },
  { name: '银河', type: 'g', stops: ['#667eea', '#764ba2'], angle: 135 },
  { name: '流星', type: 'g', stops: ['#11a37f', '#3b7dbf'], angle: 135 },
  { name: '绯霞', type: 'g', stops: ['#f7a8bc', '#8a3a68'], angle: 135 },
  { name: '晨雾', type: 'g', stops: ['#e8f0fc', '#cdd9ef'], angle: 135 },
  { name: '奶油', type: 'g', stops: ['#fdfcfb', '#e8d5c4'], angle: 135 },
  { name: '石墨', type: 'g', stops: ['#2b2e33', '#17191d'], angle: 135 },
  { name: '纯白', type: 's', stops: ['#ffffff'] },
  { name: '透明', type: 't' },
];
const st = {
  img: null, bg: 0, pad: 7, rad: 16, shadow: 55, zoom: 100,
  aspect: 'auto', wm: '', scale: 1,
};
const cv = document.getElementById('preview');
const ctx = cv.getContext('2d');

/* ================= render ================= */
function roundPath(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function render() {
  if (!st.img) return;
  const img = st.img;
  const S = st.scale;
  const padF = st.pad / 100;
  const zoomF = st.zoom / 100;
  // base canvas size from image + padding
  let iw = img.width * zoomF, ih = img.height * zoomF;
  let w = iw * (1 + padF * 2), h = ih * (1 + padF * 2);
  const minPad = Math.min(w, h) * padF;
  if (st.aspect !== 'auto') {
    const [aw, ah] = st.aspect.split(':').map(Number);
    const target = aw / ah;
    if (w / h < target) w = h * target; else h = w / target;
  }
  cv.width = Math.round(w * S); cv.height = Math.round(h * S);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.clearRect(0, 0, w, h);
  // bg
  const bg = BGS[st.bg];
  if (bg.type === 'g') {
    const a = (bg.angle || 135) * Math.PI / 180;
    const r = Math.sqrt(w * w + h * h) / 2;
    const cx = w / 2, cy = h / 2;
    const g = ctx.createLinearGradient(cx - Math.cos(a) * r, cy - Math.sin(a) * r, cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    bg.stops.forEach((s, i) => g.addColorStop(i / (bg.stops.length - 1), s));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    // subtle vignette for depth
    const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.10)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, w, h);
  } else if (bg.type === 's') {
    ctx.fillStyle = bg.stops[0];
    ctx.fillRect(0, 0, w, h);
  } // 't' = transparent: nothing
  // image with shadow, centered
  const ix = (w - iw) / 2, iy = (h - ih) / 2;
  ctx.save();
  if (st.shadow > 0) {
    ctx.shadowColor = 'rgba(8, 10, 22, ' + (0.18 + st.shadow / 100 * 0.5) + ')';
    ctx.shadowBlur = st.shadow * 1.2;
    ctx.shadowOffsetY = st.shadow * 0.45;
    roundPath(ctx, ix, iy, iw, ih, st.rad);
    ctx.fillStyle = '#000';
    ctx.fill();
  }
  ctx.restore();
  ctx.save();
  roundPath(ctx, ix, iy, iw, ih, st.rad);
  ctx.clip();
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, ix, iy, iw, ih);
  ctx.restore();
  // hairline border on the image
  ctx.save();
  roundPath(ctx, ix + 0.5, iy + 0.5, iw - 1, ih - 1, st.rad);
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
  // watermark
  if (st.wm.trim()) {
    const light = ['晨雾', '奶油', '纯白'].includes(bg.name);
    const fs = Math.max(13, Math.min(w, h) * 0.022);
    ctx.font = '500 ' + fs + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = light ? 'rgba(40,45,70,0.5)' : 'rgba(255,255,255,0.5)';
    ctx.fillText(st.wm.trim(), w - Math.max(minPad * 0.5, fs), h - Math.max(minPad * 0.45, fs * 0.9));
  }
  document.getElementById('statline').textContent =
    cv.width + ' × ' + cv.height + ' px · ' + (st.scale > 1 ? '2× 高清导出' : '1× 原始导出');
  document.getElementById('empty-hint').classList.add('hidden');
}

/* ================= load image ================= */
function loadFromSrc(src) {
  const img = new Image();
  img.onload = () => { st.img = img; render(); toast('已载入 · 裱好了'); };
  img.src = src;
}
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const rd = new FileReader();
  rd.onload = () => loadFromSrc(rd.result);
  rd.readAsDataURL(file);
}
const stage = document.getElementById('stage');
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drag'); });
stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
stage.addEventListener('drop', e => {
  e.preventDefault(); stage.classList.remove('drag');
  loadFile(e.dataTransfer.files[0]);
});
document.addEventListener('paste', e => {
  for (const it of e.clipboardData.items) {
    if (it.type.startsWith('image/')) { loadFile(it.getAsFile()); return; }
  }
});
stage.addEventListener('click', async () => {
  if (st.img) return;
  // try native clipboard first (desktop)
  if (window.desktop) {
    const d = await window.desktop.readClipboardImage();
    if (d) { loadFromSrc(d); return; }
  }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => loadFile(inp.files[0]);
  inp.click();
});

/* ================= controls ================= */
const sw = document.getElementById('swatches');
BGS.forEach((b, i) => {
  const d = document.createElement('div');
  d.className = 'swatch' + (i === st.bg ? ' on' : '') + (b.type === 't' ? ' transparent' : '');
  if (b.type === 'g') d.style.background = 'linear-gradient(135deg,' + b.stops.join(',') + ')';
  if (b.type === 's') d.style.background = b.stops[0];
  d.title = b.name;
  d.addEventListener('click', () => {
    st.bg = i;
    document.querySelectorAll('.swatch').forEach((x, j) => x.classList.toggle('on', j === i));
    render();
  });
  sw.appendChild(d);
});
function bindSlider(id, key, suffix, vId) {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    st[key] = +el.value;
    document.getElementById(vId).textContent = el.value + (suffix || '');
    render();
  });
}
bindSlider('s-pad', 'pad', '%', 'v-pad');
bindSlider('s-rad', 'rad', '', 'v-rad');
bindSlider('s-shadow', 'shadow', '', 'v-shadow');
bindSlider('s-zoom', 'zoom', '', 'v-zoom');
document.getElementById('aspect-seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  st.aspect = b.dataset.a;
  document.querySelectorAll('#aspect-seg button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('wm-text').addEventListener('input', e => { st.wm = e.target.value; render(); });
document.getElementById('btn-2x').addEventListener('click', e => {
  st.scale = st.scale === 1 ? 2 : 1;
  e.target.textContent = '导出 ' + st.scale + '×';
  render();
});

/* ================= export ================= */
let toastTimer = null;
function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
async function doCopy() {
  if (!st.img) { toast('先丢一张图进来'); return; }
  const d = cv.toDataURL('image/png');
  if (window.desktop) { await window.desktop.copyPNG(d); }
  else {
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
  }
  toast('已复制,去微信/小红书直接粘贴 ✓');
}
async function doSave() {
  if (!st.img) { toast('先丢一张图进来'); return; }
  const d = cv.toDataURL('image/png');
  if (window.desktop) {
    const ok = await window.desktop.savePNG(d, '裱一下_' + new Date().toISOString().slice(0, 10) + '.png');
    if (ok) toast('已保存 ✓');
  } else {
    const a = document.createElement('a');
    a.download = '裱一下.png'; a.href = d; a.click();
  }
}
document.getElementById('btn-copy').addEventListener('click', doCopy);
document.getElementById('btn-save').addEventListener('click', doSave);
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'c' && !getSelection().toString()) { doCopy(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); doSave(); }
});

/* ================= demo image on first launch ================= */
function makeDemo() {
  const d = document.createElement('canvas');
  d.width = 900; d.height = 560;
  const c = d.getContext('2d');
  c.fillStyle = '#101828'; c.fillRect(0, 0, 900, 560);
  // fake window chrome
  c.fillStyle = '#1a2440'; c.fillRect(0, 0, 900, 46);
  ['#ff5f57', '#febc2e', '#28c840'].forEach((col, i) => {
    c.fillStyle = col; c.beginPath(); c.arc(26 + i * 26, 23, 7, 0, 7); c.fill();
  });
  c.fillStyle = '#8b93b5'; c.font = '600 15px Consolas, monospace';
  c.fillText('demo — 把你的截图丢进来试试', 110, 29);
  // fake chart
  c.strokeStyle = '#232c45';
  for (let y = 120; y < 520; y += 66) { c.beginPath(); c.moveTo(50, y); c.lineTo(850, y); c.stroke(); }
  const pts = [430, 380, 400, 300, 320, 240, 180, 200, 140];
  c.beginPath();
  pts.forEach((p, i) => i ? c.lineTo(70 + i * 96, p) : c.moveTo(70, p));
  c.strokeStyle = '#ffd9a0'; c.lineWidth = 3; c.stroke();
  pts.forEach((p, i) => {
    c.fillStyle = '#ffd9a0'; c.beginPath(); c.arc(70 + i * 96, p, 5, 0, 7); c.fill();
  });
  c.fillStyle = '#edf1fb'; c.font = '700 26px "Microsoft YaHei", sans-serif';
  c.fillText('本周增长', 50, 96);
  c.fillStyle = '#28c840'; c.font = '700 26px Consolas, monospace';
  c.fillText('+327%', 170, 96);
  return d.toDataURL();
}
loadFromSrc(makeDemo());
</script>
</body>
</html>
